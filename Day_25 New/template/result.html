<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; }
        .result { text-align: center; padding: 30px; border-radius: 8px; margin: 20px 0; }
        .cancel { background: #ffebee; color: #c62828; border: 2px solid #c62828; }
        .no-cancel { background: #e8f5e8; color: #2e7d32; border: 2px solid #2e7d32; }
        .error { background: #fff3cd; color: #856404; border: 2px solid #ffeaa7; }
        .back-btn { background: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; margin-top: 20px; }
        .back-btn:hover { background: #545b62; }
        .probability { font-size: 1.2em; margin: 10px 0; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Prediction Result</h1>
    
    {% if error %}
        <div class="result error">
            <h2>Error</h2>
            <p>{{ error }}</p>
        </div>
    {% else %}
        <div class="result {% if prediction == 'Likely to Cancel' %}cancel{% else %}no-cancel{% endif %}">
            <h2>{{ prediction }}</h2>
            <div class="probability">Confidence: {{ confidence }}%</div>
            <div class="probability">Cancellation Probability: {{ probability }}%</div>
        </div>
    {% endif %}

    <div style="text-align: center;">
        <a href="/" class="back-btn">Make Another Prediction</a>
    </div>
</body>
</html>
