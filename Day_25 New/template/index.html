<!DOCTYPE html>
<html>
<head>
    <title>Hotel Cancellation Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        .section { background: #f9f9f9; padding: 15px; margin: 20px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Hotel Cancellation Prediction</h1>
    
    <form action="/predict" method="post">
        <div class="section">
            <h3>Booking Details</h3>
            <div class="form-group">
                <label>Hotel Type:</label>
                <select name="hotel" required>
                    <option value="Resort Hotel">Resort Hotel</option>
                    <option value="City Hotel">City Hotel</option>
                </select>
            </div>

            <div class="form-group">
                <label>Arrival Month:</label>
                <select name="arrival_date_month" required>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
            </div>

            <div class="form-group">
                <label>Lead Time (days):</label>
                <input type="number" name="lead_time" min="0" required>
            </div>

            <div class="form-group">
                <label>Arrival Week Number (1-53):</label>
                <input type="number" name="arrival_date_week_number" min="1" max="53" required>
            </div>

            <div class="form-group">
                <label>Arrival Day of Month (1-31):</label>
                <input type="number" name="arrival_date_day_of_month" min="1" max="31" required>
            </div>
        </div>

        <div class="section">
            <h3>Stay Information</h3>
            <div class="form-group">
                <label>Weekend Nights:</label>
                <input type="number" name="stays_in_weekend_nights" min="0" required>
            </div>

            <div class="form-group">
                <label>Week Nights:</label>
                <input type="number" name="stays_in_week_nights" min="0" required>
            </div>

            <div class="form-group">
                <label>Adults:</label>
                <input type="number" name="adults" min="0" required>
            </div>

            <div class="form-group">
                <label>Children:</label>
                <input type="number" name="children" min="0" required>
            </div>

            <div class="form-group">
                <label>Babies:</label>
                <input type="number" name="babies" min="0" required>
            </div>

            <div class="form-group">
                <label>Average Daily Rate (ADR):</label>
                <input type="number" step="0.01" name="adr" min="0" required>
            </div>
        </div>

        <div class="section">
            <h3>Customer Information</h3>
            <div class="form-group">
                <label>Meal Type:</label>
                <select name="meal" required>
                    <option value="BB">BB</option>
                    <option value="FB">FB</option>
                    <option value="HB">HB</option>
                    <option value="SC">SC</option>
                </select>
            </div>

            <div class="form-group">
                <label>Market Segment:</label>
                <select name="market_segment" required>
                    <option value="Direct">Direct</option>
                    <option value="Corporate">Corporate</option>
                    <option value="Online TA">Online TA</option>
                    <option value="Offline TA/TO">Offline TA/TO</option>
                    <option value="Complementary">Complementary</option>
                    <option value="Groups">Groups</option>
                </select>
            </div>

            <div class="form-group">
                <label>Distribution Channel:</label>
                <select name="distribution_channel" required>
                    <option value="Direct">Direct</option>
                    <option value="Corporate">Corporate</option>
                    <option value="TA/TO">TA/TO</option>
                    <option value="GDS">GDS</option>
                </select>
            </div>

            <div class="form-group">
                <label>Reserved Room Type:</label>
                <select name="reserved_room_type" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="G">G</option>
                    <option value="H">H</option>
                </select>
            </div>

            <div class="form-group">
                <label>Deposit Type:</label>
                <select name="deposit_type" required>
                    <option value="No Deposit">No Deposit</option>
                    <option value="Non Refund">Non Refund</option>
                    <option value="Refundable">Refundable</option>
                </select>
            </div>

            <div class="form-group">
                <label>Customer Type:</label>
                <select name="customer_type" required>
                    <option value="Transient">Transient</option>
                    <option value="Contract">Contract</option>
                    <option value="Transient-Party">Transient-Party</option>
                    <option value="Group">Group</option>
                </select>
            </div>

            <div class="form-group">
                <label>Repeated Guest?</label>
                <select name="is_repeated_guest" required>
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>
        </div>

        <div class="section">
            <h3>Booking History</h3>
            <div class="form-group">
                <label>Previous Cancellations:</label>
                <input type="number" name="previous_cancellations" min="0" required>
            </div>

            <div class="form-group">
                <label>Previous Bookings Not Canceled:</label>
                <input type="number" name="previous_bookings_not_canceled" min="0" required>
            </div>

            <div class="form-group">
                <label>Required Car Parking Spaces:</label>
                <input type="number" name="required_car_parking_spaces" min="0" required>
            </div>

            <div class="form-group">
                <label>Total Special Requests:</label>
                <input type="number" name="total_of_special_requests" min="0" required>
            </div>
        </div>

        <button type="submit">Predict Cancellation</button>
    </form>
</body>
</html>
